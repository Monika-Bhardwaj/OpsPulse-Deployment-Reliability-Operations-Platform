name: OpsPulse DevSecOps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/opspulse-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/opspulse-frontend

jobs:
  # ============================================================================
  # STEP 1 — Automated Testing (Pytest & Frontend Build)
  # ============================================================================
  test:
    name: Test — Pytest & Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: backend

      - name: Run Pytest test suite
        run: pytest -v --tb=short
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ci_test.db

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build React frontend
        run: |
          npm ci
          npm run build
        working-directory: frontend

  # ============================================================================
  # STEP 2 — Container Build, Trivy Security Gate & GHCR Publishing
  # ============================================================================
  build-scan-push:
    name: Docker Build, Trivy Scan & GHCR Push
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert repository owner to lowercase for Docker tags
        id: repo_owner
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build backend Docker image
        run: |
          docker build \
            -t ghcr.io/${{ steps.repo_owner.outputs.owner }}/opspulse-backend:${{ github.sha }} \
            -t ghcr.io/${{ steps.repo_owner.outputs.owner }}/opspulse-backend:latest \
            ./backend

      - name: Build frontend Docker image
        run: |
          docker build \
            -t ghcr.io/${{ steps.repo_owner.outputs.owner }}/opspulse-frontend:${{ github.sha }} \
            -t ghcr.io/${{ steps.repo_owner.outputs.owner }}/opspulse-frontend:latest \
            ./frontend

      # DevSecOps Gate: Trivy image vulnerability scanning
      - name: Trivy Scan — Backend Image
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: ghcr.io/${{ steps.repo_owner.outputs.owner }}/opspulse-backend:${{ github.sha }}
          format: "table"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy Scan — Frontend Image
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: ghcr.io/${{ steps.repo_owner.outputs.owner }}/opspulse-frontend:${{ github.sha }}
          format: "table"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: "1"

      - name: Push Docker images to GHCR (on push to main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker push ghcr.io/${{ steps.repo_owner.outputs.owner }}/opspulse-backend:${{ github.sha }}
          docker push ghcr.io/${{ steps.repo_owner.outputs.owner }}/opspulse-backend:latest
          docker push ghcr.io/${{ steps.repo_owner.outputs.owner }}/opspulse-frontend:${{ github.sha }}
          docker push ghcr.io/${{ steps.repo_owner.outputs.owner }}/opspulse-frontend:latest

  # ============================================================================
  # STEP 3 — End-to-End Kubernetes Verification (KinD in CI)
  # ============================================================================
  deploy:
    name: Verify Kubernetes Deployment
    needs: build-scan-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Convert repository owner to lowercase
        id: repo_owner
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Create KinD Kubernetes Cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: kind

      - name: Build images locally for KinD
        run: |
          docker build -t ghcr.io/${{ steps.repo_owner.outputs.owner }}/opspulse-backend:${{ github.sha }} ./backend
          docker build -t ghcr.io/${{ steps.repo_owner.outputs.owner }}/opspulse-frontend:${{ github.sha }} ./frontend
          kind load docker-image ghcr.io/${{ steps.repo_owner.outputs.owner }}/opspulse-backend:${{ github.sha }}
          kind load docker-image ghcr.io/${{ steps.repo_owner.outputs.owner }}/opspulse-frontend:${{ github.sha }}

      - name: Create Kubernetes namespace
        run: kubectl apply -f k8s/namespace.yaml

      - name: Substitute image tag in manifests
        run: |
          sed -i "s|ghcr.io/monika-bhardwaj/opspulse-backend:__IMAGE_TAG__|ghcr.io/${{ steps.repo_owner.outputs.owner }}/opspulse-backend:${{ github.sha }}|g" k8s/deployment.yaml
          sed -i "s|ghcr.io/monika-bhardwaj/opspulse-frontend:__IMAGE_TAG__|ghcr.io/${{ steps.repo_owner.outputs.owner }}/opspulse-frontend:${{ github.sha }}|g" k8s/deployment.yaml

      - name: Deploy application to cluster
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/ingress.yaml

      - name: Wait for backend pods to be ready
        run: |
          kubectl wait --for=condition=ready pod \
            -l app=opspulse-backend \
            -n opspulse \
            --timeout=120s

      - name: Verify health & metrics endpoints via port-forward
        run: |
          kubectl port-forward service/opspulse-backend 8000:80 -n opspulse &
          sleep 4
          echo "Checking /health endpoint..."
          curl -sf http://localhost:8000/health
          echo -e "\nChecking /ready endpoint..."
          curl -sf http://localhost:8000/ready
          echo -e "\nChecking /metrics endpoint..."
          curl -sf http://localhost:8000/metrics | head -n 15
