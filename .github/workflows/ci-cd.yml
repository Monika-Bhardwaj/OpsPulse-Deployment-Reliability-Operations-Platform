name: TaskBoard Python CI/CD

on:
  push:
    branches: main
  pull_request:
    branches: main

# ========================================
# STEP 1 — Test
# ========================================
jobs:
  test:
    name: Test - Backend & Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}

      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Run backend tests
        run: pytest -q
        working-directory: backend

      - uses: actions/setup-node@v4
        with: {node-version: '22'}

      - name: Build frontend
        run: npm install && npm run build
        working-directory: frontend

  # ========================================
  # STEP 2 — Build Docker Images
  # ========================================
  docker-build:
    name: Docker Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend image
        run: |
          docker build -t nensiravaliya28/taskboard-backend:${{ github.sha }} ./backend

      - name: Build frontend image
        run: |
          docker build -t nensiravaliya28/taskboard-frontend:${{ github.sha }} ./frontend

  # ========================================
  # STEP 3 — Scan Docker Images with Trivy
  # ========================================
  image-scan:
    name: Image Scan - Trivy
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Rebuild backend image for scan
        run: |
          docker build -t nensiravaliya28/taskboard-backend:${{ github.sha }} ./backend

      - name: Rebuild frontend image for scan
        run: |
          docker build -t nensiravaliya28/taskboard-frontend:${{ github.sha }} ./frontend

      - name: Install Trivy
        run: |
          sudo apt-get install -y wget
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -y trivy

      - name: Scan backend image
        run: |
          trivy image --severity HIGH,CRITICAL --ignore-unfixed \
            nensiravaliya28/taskboard-backend:${{ github.sha }}

      - name: Scan frontend image
        run: |
          trivy image --severity HIGH,CRITICAL --ignore-unfixed \
            nensiravaliya28/taskboard-frontend:${{ github.sha }}

  # ========================================
  # STEP 4 — Push Images to Docker Hub
  # ========================================
  push:
    name: Push Images to Docker Hub
    needs: image-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: nensiravaliya28
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and tag backend image
        run: |
          docker build \
            -t nensiravaliya28/taskboard-backend:${{ github.sha }} \
            -t nensiravaliya28/taskboard-backend:latest \
            ./backend

      - name: Build and tag frontend image
        run: |
          docker build \
            -t nensiravaliya28/taskboard-frontend:${{ github.sha }} \
            -t nensiravaliya28/taskboard-frontend:latest \
            ./frontend

      - name: Push backend image
        run: |
          docker push nensiravaliya28/taskboard-backend:${{ github.sha }}
          docker push nensiravaliya28/taskboard-backend:latest

      - name: Push frontend image
        run: |
          docker push nensiravaliya28/taskboard-frontend:${{ github.sha }}
          docker push nensiravaliya28/taskboard-frontend:latest

  # ========================================
  # STEP 5 — Deploy to local kind cluster
  # ========================================
  deploy:
    name: Deploy to kind (self-hosted)
    if: github.ref == 'refs/heads/main'
    needs: push
    # ✅ Runs on YOUR machine where kind cluster lives
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm (if not present)
        run: |
          if ! command -v helm &> /dev/null; then
            curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          fi

      - name: Load images into kind cluster
        run: |
          docker pull nensiravaliya28/taskboard-backend:${{ github.sha }}
          docker pull nensiravaliya28/taskboard-frontend:${{ github.sha }}
          kind load docker-image nensiravaliya28/taskboard-backend:${{ github.sha }}
          kind load docker-image nensiravaliya28/taskboard-frontend:${{ github.sha }}

      - name: Deploy with Helm
        run: |
          helm upgrade --install taskboard ./helm/taskboard -n taskboard --create-namespace \
            --set backend.tag=${{ github.sha }} \
            --set frontend.tag=${{ github.sha }} \
            --set backend.image=nensiravaliya28/taskboard-backend \
            --set frontend.image=nensiravaliya28/taskboard-frontend \
            --set backend.pullPolicy=Never \
            --set frontend.pullPolicy=Never
