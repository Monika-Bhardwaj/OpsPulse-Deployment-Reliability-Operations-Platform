apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opspulse-ingress
  namespace: opspulse
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  rules:
    - host: opspulse.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: opspulse-backend
                port:
                  number: 80
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: opspulse-backend
                port:
                  number: 80
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: opspulse-backend
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: opspulse-frontend
                port:
                  number: 80
