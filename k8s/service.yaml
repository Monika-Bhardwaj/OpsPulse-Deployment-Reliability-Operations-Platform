apiVersion: v1
kind: Service
metadata:
  name: opspulse-backend
  namespace: opspulse
  labels:
    app: opspulse-backend
spec:
  type: ClusterIP
  selector:
    app: opspulse-backend
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: opspulse-frontend
  namespace: opspulse
  labels:
    app: opspulse-frontend
spec:
  type: ClusterIP
  selector:
    app: opspulse-frontend
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
