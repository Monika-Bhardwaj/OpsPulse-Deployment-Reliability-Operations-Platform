apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opspulse.fullname" . }}-backend
  labels:
    app: opspulse-backend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: opspulse-backend
  template:
    metadata:
      labels:
        app: opspulse-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      initContainers:
        - name: wait-for-db
          image: "{{ .Values.backend.image }}:{{ .Values.backend.tag }}"
          env:
            - name: DATABASE_URL
              value: "postgresql+psycopg://{{ .Values.postgres.username }}:{{ .Values.postgres.password }}@{{ .Values.postgres.host }}:5432/{{ .Values.postgres.database }}"
          command:
            - python
            - -c
            - |
              import os, socket, sys, time, urllib.parse
              u = urllib.parse.urlparse(os.environ["DATABASE_URL"])
              host, port = u.hostname, u.port or 5432
              for i in range(60):
                  try:
                      s = socket.create_connection((host, port), timeout=3)
                      s.close()
                      print("database reachable, starting backend", flush=True)
                      break
                  except OSError as exc:
                      print(f"waiting for postgres at {host}:{port} (attempt {i+1}/60): {exc}", flush=True)
                      time.sleep(2)
              else:
                  print("database unreachable after 120s, giving up", flush=True)
                  sys.exit(1)
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
      containers:
        - name: backend
          image: "{{ .Values.backend.image }}:{{ .Values.backend.tag }}"
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DATABASE_URL
              value: "postgresql+psycopg://{{ .Values.postgres.username }}:{{ .Values.postgres.password }}@{{ .Values.postgres.host }}:5432/{{ .Values.postgres.database }}"
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
{{ toYaml .Values.resources | indent 12 }}
