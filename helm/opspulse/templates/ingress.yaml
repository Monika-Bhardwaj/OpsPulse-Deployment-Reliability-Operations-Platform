{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "opspulse.fullname" . }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "opspulse.fullname" . }}-backend
                port:
                  number: 80
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: {{ include "opspulse.fullname" . }}-backend
                port:
                  number: 80
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: {{ include "opspulse.fullname" . }}-backend
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "opspulse.fullname" . }}-frontend
                port:
                  number: 80
{{- end }}
